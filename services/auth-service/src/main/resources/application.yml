server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${AUTH_DB_USERNAME:gpay}
    password: ${AUTH_DB_PASSWORD:gpay}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:change-this-secret-minimum-32-characters-long}
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
  refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}

auth:
  wallet:
    provision-url: ${AUTH_WALLET_PROVISION_URL:http://localhost:8082/internal/wallets/provision}
    internal-token: ${AUTH_WALLET_INTERNAL_TOKEN:change-this-wallet-internal-token}
    provision-timeout-ms: ${AUTH_WALLET_PROVISION_TIMEOUT_MS:5000}

admin:
  bootstrap:
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
