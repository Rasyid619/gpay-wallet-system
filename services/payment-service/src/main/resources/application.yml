server:
  port: 8083

spring:
  application:
    name: payment-service

  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${PAYMENT_DB_USERNAME:gpay}
    password: ${PAYMENT_DB_PASSWORD:gpay}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:change-this-secret-minimum-32-characters-long}

payment:
  rate-limit:
    max-requests-per-minute: ${PAYMENT_TOPUP_RATE_LIMIT_PER_MINUTE:5}
  gateway:
    top-up-url: ${PAYMENT_GATEWAY_TOP_UP_URL}
    timeout-ms: ${PAYMENT_GATEWAY_TIMEOUT_MS}
