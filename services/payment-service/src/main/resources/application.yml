server:
  port: 8083

spring:
  application:
    name: payment-service

  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${PAYMENT_DB_USERNAME:gpay}
    password: ${PAYMENT_DB_PASSWORD:gpay}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

jwt:
  secret: ${JWT_SECRET:change-this-secret-minimum-32-characters-long}

payment:
  rate-limit:
    max-requests-per-minute: ${PAYMENT_TOPUP_RATE_LIMIT_PER_MINUTE:5}
  gateway:
    top-up-url: ${PAYMENT_GATEWAY_TOP_UP_URL}
    timeout-ms: ${PAYMENT_GATEWAY_TIMEOUT_MS}
  webhook:
    gateway-secret: ${PAYMENT_GATEWAY_WEBHOOK_SECRET}
  kafka:
    wallet-credit-commands-topic: ${PAYMENT_KAFKA_WALLET_CREDIT_COMMANDS_TOPIC:wallet.credit.commands}
    topup-succeeded-topic: ${PAYMENT_KAFKA_TOPUP_SUCCEEDED_TOPIC:payment.topup.succeeded}
    topup-failed-topic: ${PAYMENT_KAFKA_TOPUP_FAILED_TOPIC:payment.topup.failed}
  outbox:
    retry-delay-ms: ${PAYMENT_OUTBOX_RETRY_DELAY_MS}
    max-attempts: ${PAYMENT_OUTBOX_MAX_ATTEMPTS}
    max-age-ms: ${PAYMENT_OUTBOX_MAX_AGE_MS}
    processing-timeout-ms: ${PAYMENT_OUTBOX_PROCESSING_TIMEOUT_MS}
    batch-size: ${PAYMENT_OUTBOX_BATCH_SIZE}
    worker-fixed-delay-ms: ${PAYMENT_OUTBOX_WORKER_FIXED_DELAY_MS}
    worker-initial-delay-ms: ${PAYMENT_OUTBOX_WORKER_INITIAL_DELAY_MS}
