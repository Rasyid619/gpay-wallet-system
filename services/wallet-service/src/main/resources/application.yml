server:
  port: 8082

spring:
  application:
    name: wallet-service

  datasource:
    url: ${WALLET_DB_URL:jdbc:postgresql://localhost:5432/wallet_db}
    username: ${WALLET_DB_USERNAME:gpay}
    password: ${WALLET_DB_PASSWORD:gpay}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${WALLET_KAFKA_CONSUMER_GROUP_ID:wallet-service}

jwt:
  secret: ${JWT_SECRET:change-this-secret-minimum-32-characters-long}

wallet:
  internal-token: ${WALLET_INTERNAL_TOKEN:}
  transfer:
    max-daily-transfer-amount: ${MAX_DAILY_TRANSFER_AMOUNT:10000000}
  reconciliation:
    enabled: ${WALLET_RECONCILIATION_ENABLED:true}
    cron: ${WALLET_RECONCILIATION_CRON:0 0 * * * *}
  kafka:
    wallet-credit-commands-topic: ${WALLET_KAFKA_WALLET_CREDIT_COMMANDS_TOPIC:wallet.credit.commands}
    dead-letter-topic: ${WALLET_KAFKA_DEAD_LETTER_TOPIC:dead-letter.events}
    transfer-completed-topic: ${WALLET_KAFKA_TRANSFER_COMPLETED_TOPIC:wallet.transfer.completed}
    transfer-received-topic: ${WALLET_KAFKA_TRANSFER_RECEIVED_TOPIC:wallet.transfer.received}
    transfer-failed-topic: ${WALLET_KAFKA_TRANSFER_FAILED_TOPIC:wallet.transfer.failed}
  outbox:
    retry-delay-ms: ${WALLET_OUTBOX_RETRY_DELAY_MS:60000}
    max-attempts: ${WALLET_OUTBOX_MAX_ATTEMPTS:5}
    max-age-ms: ${WALLET_OUTBOX_MAX_AGE_MS:86400000}
    processing-timeout-ms: ${WALLET_OUTBOX_PROCESSING_TIMEOUT_MS:300000}
    batch-size: ${WALLET_OUTBOX_BATCH_SIZE:10}
    worker-fixed-delay-ms: ${WALLET_OUTBOX_WORKER_FIXED_DELAY_MS:5000}
    worker-initial-delay-ms: ${WALLET_OUTBOX_WORKER_INITIAL_DELAY_MS:5000}
