server:
  port: 8082

spring:
  application:
    name: wallet-service

  datasource:
    url: ${WALLET_DB_URL:jdbc:postgresql://localhost:5432/wallet_db}
    username: ${WALLET_DB_USERNAME:gpay}
    password: ${WALLET_DB_PASSWORD:gpay}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:change-this-secret-minimum-32-characters-long}
