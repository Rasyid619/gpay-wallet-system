services:
  postgres:
    image: postgres:16-alpine
    container_name: gpay-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gpay}
      POSTGRES_DB: ${POSTGRES_DB:-gpay}
    ports:
      - "5432:5432"
    volumes:
      - gpay_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gpay-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./services/auth-service
    image: gpay-auth-service:local
    container_name: gpay-auth-service
    depends_on:
      postgres:
        condition: service_healthy
      wallet-service:
        condition: service_started
    environment:
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/auth_db
      AUTH_DB_USERNAME: ${AUTH_DB_USERNAME:-gpay}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-gpay}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-minimum-32-characters-long}
      JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-15}
      JWT_REFRESH_TOKEN_EXPIRATION_DAYS: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-7}
      AUTH_WALLET_PROVISION_URL: http://wallet-service:8082/internal/wallets/provision
      AUTH_WALLET_INTERNAL_TOKEN: ${AUTH_WALLET_INTERNAL_TOKEN:-change-this-wallet-internal-token}
      AUTH_WALLET_PROVISION_TIMEOUT_MS: ${AUTH_WALLET_PROVISION_TIMEOUT_MS:-5000}
    ports:
      - "8081:8081"

  wallet-service:
    build:
      context: ./services/wallet-service
    image: gpay-wallet-service:local
    container_name: gpay-wallet-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WALLET_DB_URL: jdbc:postgresql://postgres:5432/wallet_db
      WALLET_DB_USERNAME: ${WALLET_DB_USERNAME:-gpay}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:-gpay}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-minimum-32-characters-long}
      WALLET_INTERNAL_TOKEN: ${WALLET_INTERNAL_TOKEN:-change-this-wallet-internal-token}
      MAX_DAILY_TRANSFER_AMOUNT: ${MAX_DAILY_TRANSFER_AMOUNT:-10000000}
    ports:
      - "8082:8082"

  payment-service:
    build:
      context: ./services/payment-service
    image: gpay-payment-service:local
    container_name: gpay-payment-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      wallet-service:
        condition: service_started
      mock-gateway-service:
        condition: service_started
    environment:
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/payment_db
      PAYMENT_DB_USERNAME: ${PAYMENT_DB_USERNAME:-gpay}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-gpay}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-minimum-32-characters-long}
      PAYMENT_TOPUP_RATE_LIMIT_PER_MINUTE: ${PAYMENT_TOPUP_RATE_LIMIT_PER_MINUTE:-5}
      PAYMENT_GATEWAY_TOP_UP_URL: http://mock-gateway-service:8084/mock-gateway/top-up
      PAYMENT_GATEWAY_TIMEOUT_MS: ${PAYMENT_GATEWAY_TIMEOUT_MS:-5000}
      PAYMENT_GATEWAY_WEBHOOK_SECRET: ${PAYMENT_GATEWAY_WEBHOOK_SECRET:-change-this-gateway-secret}
      PAYMENT_WALLET_CREDIT_URL: http://wallet-service:8082/internal/wallets/credit
      PAYMENT_WALLET_INTERNAL_TOKEN: ${PAYMENT_WALLET_INTERNAL_TOKEN:-change-this-wallet-internal-token}
      PAYMENT_OUTBOX_REQUEST_TIMEOUT_MS: ${PAYMENT_OUTBOX_REQUEST_TIMEOUT_MS:-5000}
      PAYMENT_OUTBOX_RETRY_DELAY_MS: ${PAYMENT_OUTBOX_RETRY_DELAY_MS:-60000}
      PAYMENT_OUTBOX_MAX_ATTEMPTS: ${PAYMENT_OUTBOX_MAX_ATTEMPTS:-10}
      PAYMENT_OUTBOX_PROCESSING_TIMEOUT_MS: ${PAYMENT_OUTBOX_PROCESSING_TIMEOUT_MS:-300000}
      PAYMENT_OUTBOX_BATCH_SIZE: ${PAYMENT_OUTBOX_BATCH_SIZE:-10}
      PAYMENT_OUTBOX_WORKER_FIXED_DELAY_MS: ${PAYMENT_OUTBOX_WORKER_FIXED_DELAY_MS:-5000}
      PAYMENT_OUTBOX_WORKER_INITIAL_DELAY_MS: ${PAYMENT_OUTBOX_WORKER_INITIAL_DELAY_MS:-5000}
    ports:
      - "8083:8083"

  mock-gateway-service:
    build:
      context: ./services/mock-gateway-service
    image: gpay-mock-gateway-service:local
    container_name: gpay-mock-gateway-service
    environment:
      MOCK_GATEWAY_TIMEOUT_DELAY_MS: ${MOCK_GATEWAY_TIMEOUT_DELAY_MS:-6000}
      PAYMENT_WEBHOOK_URL: http://payment-service:8083/payments/webhook/gateway
      GATEWAY_WEBHOOK_SECRET: ${GATEWAY_WEBHOOK_SECRET:-change-this-gateway-secret}
    ports:
      - "8084:8084"

volumes:
  gpay_postgres_data:
