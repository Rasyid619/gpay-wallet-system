openapi: 3.0.3
info:
  title: GPay Wallet System API
  version: 0.1.0
  description: Implemented API contract for the Auth Service, Wallet Service, Payment Service, and Mock Gateway Service. Local server URLs match the Docker Compose host port mappings.

servers:
  - url: http://localhost:8081
    description: Local Auth Service.
  - url: http://localhost:8082
    description: Local Wallet Service.
  - url: http://localhost:8083
    description: Local Payment Service.
  - url: http://localhost:8084
    description: Local Mock Gateway Service.

tags:
  - name: Auth
    description: Operations for user identity, access tokens, and refresh tokens.
  - name: Internal Wallet
    description: Internal service-to-service wallet operations.
  - name: Payment
    description: Operations for authenticated payment top-up workflows.
  - name: Mock Gateway
    description: Operations for mock payment gateway simulations.
  - name: Wallet
    description: Operations for authenticated wallet balance, mutation history, and transfers.

paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a user.
      description: Creates a user account with a BCrypt-hashed password.
      servers:
        - url: http://localhost:8081
          description: Local Auth Service.
      parameters:
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
      responses:
        "201":
          description: User was registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRegisterShowResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login a user.
      description: Returns a JWT access token and opaque refresh token for valid credentials.
      servers:
        - url: http://localhost:8081
          description: Local Auth Service.
      parameters:
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenShowResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh tokens.
      description: Rotates a valid refresh token and returns a new access token and refresh token.
      servers:
        - url: http://localhost:8081
          description: Local Auth Service.
      parameters:
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRefreshRequest"
      responses:
        "200":
          description: Tokens were refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenShowResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags:
        - Auth
      summary: Get the authenticated user.
      description: Returns the profile for the user identified by the JWT access token.
      servers:
        - url: http://localhost:8081
          description: Local Auth Service.
      parameters:
        - $ref: "#/components/parameters/TraceId"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Authenticated user was retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeShowResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /wallets/balance:
    get:
      tags:
        - Wallet
      summary: Get the authenticated wallet balance.
      description: Returns the authenticated user's wallet balance as whole IDR.
      servers:
        - url: http://localhost:8082
          description: Local Wallet Service.
      parameters:
        - $ref: "#/components/parameters/TraceId"
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Wallet balance was retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletBalanceShowResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/WalletNotFound"

  /wallets/mutations:
    get:
      tags:
        - Wallet
      summary: List authenticated wallet mutations.
      description: Returns wallet ledger mutations for the authenticated user's wallet only, ordered newest first.
      servers:
        - url: http://localhost:8082
          description: Local Wallet Service.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TraceId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Wallet mutations were retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletMutationIndexResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /wallets/transfer:
    post:
      tags:
        - Wallet
      summary: Transfer money to another wallet.
      description: Atomically debits the authenticated user's wallet and credits the receiver wallet. Requires durable PostgreSQL idempotency by Idempotency-Key.
      servers:
        - url: http://localhost:8082
          description: Local Wallet Service.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TraceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletTransferCreateRequest"
      responses:
        "200":
          description: Transfer response was returned. Duplicate requests with the same idempotency key and payload return the stored response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletTransferShowResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/WalletNotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal/wallets/credit:
    post:
      tags:
        - Internal Wallet
      summary: Credit a wallet from payment-service.
      description: Internal endpoint used by payment-service outbox retry to credit a wallet after a successful top-up. Requires internal token authentication, Idempotency-Key, and idempotency by payment_transaction_id.
      servers:
        - url: http://localhost:8082
          description: Local Wallet Service.
      security:
        - InternalTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/TraceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalWalletCreditCreateRequest"
      responses:
        "200":
          description: Wallet credit response was returned. Retries for the same payment transaction return the stored response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalWalletCreditShowResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/WalletNotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /payments/top-up:
    post:
      tags:
        - Payment
      summary: Create a payment top-up transaction.
      description: Creates or replays an authenticated payment top-up transaction using durable PostgreSQL idempotency, stores an internal payment activity log for new accepted requests, then calls Mock Gateway through WebClient. Gateway timeouts leave the transaction PENDING.
      servers:
        - url: http://localhost:8083
          description: Local Payment Service.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TraceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentTopUpCreateRequest"
      responses:
        "201":
          description: Top-up transaction was created. Duplicate requests with the same idempotency key and payload return the stored response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentTopUpShowResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /payments/webhook/gateway:
    post:
      tags:
        - Payment
      summary: Receive a signed mock gateway webhook.
      description: Validates X-Gateway-Signature using HMAC_SHA256(secret, timestamp + "." + rawRequestBody) before updating the payment transaction to SUCCESS or FAILED. SUCCESS webhooks enqueue one pending wallet-credit outbox event. SUCCESS and FAILED status transitions store internal payment activity logs; activity logs are not exposed as API resources.
      servers:
        - url: http://localhost:8083
          description: Local Payment Service.
      parameters:
        - $ref: "#/components/parameters/TraceId"
        - name: X-Gateway-Signature
          in: header
          required: true
          description: HMAC SHA-256 signature for timestamp and exact raw JSON body.
          schema:
            type: string
        - name: X-Gateway-Timestamp
          in: header
          required: true
          description: Timestamp included in the signature input.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentGatewayWebhookCreateRequest"
      responses:
        "200":
          description: Gateway webhook was accepted and payment transaction status was updated. SUCCESS creates or reuses pending wallet-credit outbox work.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentGatewayWebhookShowResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /mock-gateway/top-up:
    post:
      tags:
        - Mock Gateway
      summary: Simulate a gateway top-up request.
      description: Accepts a mock gateway simulation request. SUCCESS and FAILED send a signed webhook callback to the configured Payment webhook URL. TIMEOUT delays using the service timeout simulation setting and does not send a callback.
      servers:
        - url: http://localhost:8084
          description: Local Mock Gateway Service.
      parameters:
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockGatewayTopUpCreateRequest"
      responses:
        "200":
          description: Gateway simulation response was returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockGatewayTopUpShowResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  parameters:
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      description: Optional request trace id. If omitted, the service generates one, returns it in the X-Trace-Id response header, stores it in MDC logs, and propagates it on service-to-service calls.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Durable idempotency key for money-moving requests.
      schema:
        type: string
        minLength: 1
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page number.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Page size. Values above 100 are capped by the service.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validation_error:
              value:
                error: VALIDATION_ERROR
                message: email must be a well-formed email address
            insufficient_balance:
              value:
                error: INSUFFICIENT_BALANCE
                message: Wallet balance is not enough for this transfer
            daily_limit_exceeded:
              value:
                error: DAILY_TRANSFER_LIMIT_EXCEEDED
                message: Daily transfer limit exceeded
            same_wallet_transfer:
              value:
                error: SAME_WALLET_TRANSFER
                message: Sender and receiver wallet must be different
    Conflict:
      description: The request conflicts with an existing resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            email_registered:
              value:
                error: EMAIL_ALREADY_REGISTERED
                message: Email is already registered
            idempotency_key_conflict:
              value:
                error: IDEMPOTENCY_KEY_CONFLICT
                message: Idempotency key was already used with a different request
            payment_transaction_conflict:
              value:
                error: PAYMENT_TRANSACTION_CONFLICT
                message: Payment transaction was already credited with a different request
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: NOT_FOUND
            message: Resource was not found
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: UNAUTHORIZED
            message: Authentication is required
            trace_id: trace-auth-123
    TooManyRequests:
      description: The authenticated user exceeded the payment top-up rate limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: RATE_LIMIT_EXCEEDED
            message: Maximum 5 payment requests per minute allowed
    ServiceUnavailable:
      description: The service cannot safely process the request because a required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: RATE_LIMIT_UNAVAILABLE
            message: Payment rate limit cannot be verified
    WalletNotFound:
      description: Wallet row was not found for the authenticated user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: WALLET_NOT_FOUND
            message: Wallet was not found for authenticated user

    InsufficientBalance:
      description: Sender wallet balance is not enough for the transfer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: INSUFFICIENT_BALANCE
            message: Wallet balance is not enough for this transfer

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    InternalTokenAuth:
      type: apiKey
      in: header
      name: X-Internal-Token

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid request
        trace_id:
          type: string
          nullable: true
          description: Request trace id generated or preserved by the service when the error is handled by the service exception layer.
          example: trace-payment-123

    AuthRegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: Must contain uppercase, lowercase, digit, and special character.
          example: Password1!

    AuthRegisterShowResponse:
      type: object
      required:
        - user_id
        - email
        - created_at
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time

    AuthLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: Password1!

    AuthRefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    AuthTokenShowResponse:
      type: object
      required:
        - access_token
        - refresh_token
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    AuthMeShowResponse:
      type: object
      required:
        - user_id
        - email
        - role
        - created_at
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          example: USER
        created_at:
          type: string
          format: date-time

    WalletBalanceShowResponse:
      type: object
      required:
        - wallet_id
        - balance
      properties:
        wallet_id:
          type: string
          format: uuid
        balance:
          type: integer
          format: int64
          description: Current balance in whole IDR.
          example: 125000

    WalletMutationIndexResponse:
      type: object
      required:
        - page
        - size
        - total_items
        - total_pages
        - items
      properties:
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        total_items:
          type: integer
          format: int64
          example: 2
        total_pages:
          type: integer
          example: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/WalletMutationIndexElement"

    WalletMutationIndexElement:
      type: object
      required:
        - mutation_id
        - type
        - source
        - amount
        - balance_after
        - created_at
      properties:
        mutation_id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - DEBIT
            - CREDIT
        source:
          type: string
          enum:
            - TRANSFER
            - TOP_UP
        amount:
          type: integer
          format: int64
          description: Mutation amount in whole IDR.
          example: 50000
        balance_after:
          type: integer
          format: int64
          description: Wallet balance after the mutation in whole IDR.
          example: 150000
        related_transaction_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

    WalletTransferCreateRequest:
      type: object
      required:
        - receiver_wallet_id
        - amount
      properties:
        receiver_wallet_id:
          type: string
          format: uuid
          description: Wallet that receives the transfer credit.
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Transfer amount in whole IDR.
          example: 25000

    WalletTransferShowResponse:
      type: object
      required:
        - transfer_id
        - sender_wallet_id
        - receiver_wallet_id
        - amount
        - status
        - created_at
      properties:
        transfer_id:
          type: string
          format: uuid
        sender_wallet_id:
          type: string
          format: uuid
        receiver_wallet_id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          description: Transfer amount in whole IDR.
          example: 25000
        status:
          type: string
          enum:
            - SUCCESS
        created_at:
          type: string
          format: date-time

    InternalWalletCreditCreateRequest:
      type: object
      required:
        - wallet_id
        - payment_transaction_id
        - amount
      properties:
        wallet_id:
          type: string
          format: uuid
          description: Wallet that receives the top-up credit.
        payment_transaction_id:
          type: string
          format: uuid
          description: Payment-service transaction identifier used for idempotency.
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Credit amount in whole IDR.
          example: 50000

    InternalWalletCreditShowResponse:
      type: object
      required:
        - wallet_id
        - payment_transaction_id
        - amount
        - balance_after
        - credited_at
      properties:
        wallet_id:
          type: string
          format: uuid
        payment_transaction_id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          description: Credited amount in whole IDR.
          example: 50000
        balance_after:
          type: integer
          format: int64
          description: Wallet balance after credit in whole IDR.
          example: 150000
        credited_at:
          type: string
          format: date-time

    PaymentTopUpCreateRequest:
      type: object
      required:
        - wallet_id
        - amount
        - gateway_mode
      properties:
        wallet_id:
          type: string
          format: uuid
          description: Wallet intended to receive the top-up credit.
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Top-up amount in whole IDR.
          example: 75000
        gateway_mode:
          type: string
          enum:
            - SUCCESS
            - FAILED
            - TIMEOUT
          description: Mock gateway behavior to request for this top-up simulation.

    PaymentTopUpShowResponse:
      type: object
      required:
        - payment_transaction_id
        - wallet_id
        - amount
        - status
        - created_at
      properties:
        payment_transaction_id:
          type: string
          format: uuid
        wallet_id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          description: Top-up amount in whole IDR.
          example: 75000
        status:
          type: string
          enum:
            - PENDING
        created_at:
          type: string
          format: date-time

    PaymentGatewayWebhookCreateRequest:
      type: object
      required:
        - payment_transaction_id
        - wallet_id
        - amount
        - status
        - gateway_reference
      properties:
        payment_transaction_id:
          type: string
          format: uuid
        wallet_id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Top-up amount in whole IDR.
          example: 75000
        status:
          type: string
          enum:
            - SUCCESS
            - FAILED
        gateway_reference:
          type: string
          example: gw-4f437123-8c2d-41c5-9300-a0f8f72fd6e3

    PaymentGatewayWebhookShowResponse:
      type: object
      required:
        - payment_transaction_id
        - status
      properties:
        payment_transaction_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - SUCCESS
            - FAILED

    MockGatewayTopUpCreateRequest:
      type: object
      required:
        - payment_transaction_id
        - wallet_id
        - amount
        - mode
      properties:
        payment_transaction_id:
          type: string
          format: uuid
          description: Payment-service transaction identifier being simulated by the gateway.
        wallet_id:
          type: string
          format: uuid
          description: Wallet intended to receive the top-up credit.
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Top-up amount in whole IDR.
          example: 75000
        mode:
          type: string
          enum:
            - SUCCESS
            - FAILED
            - TIMEOUT
          description: Gateway behavior to simulate. SUCCESS and FAILED send signed webhook callbacks using HMAC_SHA256(secret, timestamp + "." + rawRequestBody).

    MockGatewayTopUpShowResponse:
      type: object
      required:
        - payment_transaction_id
        - wallet_id
        - amount
        - mode
        - status
        - gateway_reference
        - message
      properties:
        payment_transaction_id:
          type: string
          format: uuid
        wallet_id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          description: Top-up amount in whole IDR.
          example: 75000
        mode:
          type: string
          enum:
            - SUCCESS
            - FAILED
            - TIMEOUT
        status:
          type: string
          enum:
            - SUCCESS
            - FAILED
            - TIMEOUT
        gateway_reference:
          type: string
          example: gw-4f437123-8c2d-41c5-9300-a0f8f72fd6e3
        message:
          type: string
          example: Gateway accepted successful top-up simulation

    GatewayWebhookPayload:
      type: object
      description: Payload sent by Mock Gateway to the configured Payment webhook URL for SUCCESS and FAILED modes.
      required:
        - payment_transaction_id
        - wallet_id
        - amount
        - status
        - gateway_reference
      properties:
        payment_transaction_id:
          type: string
          format: uuid
        wallet_id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          description: Top-up amount in whole IDR.
          example: 75000
        status:
          type: string
          enum:
            - SUCCESS
            - FAILED
