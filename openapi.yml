openapi: 3.0.3
info:
  title: GPay Wallet System API
  version: 0.1.0
  description: Implemented API contract for the Auth Service and Wallet Service.

servers:
  - url: http://localhost:8081
    description: Local Auth Service.
  - url: http://localhost:8082
    description: Local Wallet Service.

tags:
  - name: Auth
    description: Operations for user identity, access tokens, and refresh tokens.
  - name: Wallet
    description: Operations for authenticated wallet balance and mutation history.

paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a user.
      description: Creates a user account with a BCrypt-hashed password.
      servers:
        - url: http://localhost:8081
          description: Local Auth Service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
      responses:
        "201":
          description: User was registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRegisterShowResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login a user.
      description: Returns a JWT access token and opaque refresh token for valid credentials.
      servers:
        - url: http://localhost:8081
          description: Local Auth Service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenShowResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh tokens.
      description: Rotates a valid refresh token and returns a new access token and refresh token.
      servers:
        - url: http://localhost:8081
          description: Local Auth Service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRefreshRequest"
      responses:
        "200":
          description: Tokens were refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenShowResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags:
        - Auth
      summary: Get the authenticated user.
      description: Returns the profile for the user identified by the JWT access token.
      servers:
        - url: http://localhost:8081
          description: Local Auth Service.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Authenticated user was retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeShowResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /wallets/balance:
    get:
      tags:
        - Wallet
      summary: Get the authenticated wallet balance.
      description: Returns the authenticated user's wallet balance as whole IDR.
      servers:
        - url: http://localhost:8082
          description: Local Wallet Service.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Wallet balance was retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletBalanceShowResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/WalletNotFound"

  /wallets/mutations:
    get:
      tags:
        - Wallet
      summary: List authenticated wallet mutations.
      description: Returns wallet ledger mutations for the authenticated user's wallet only, ordered newest first.
      servers:
        - url: http://localhost:8082
          description: Local Wallet Service.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Wallet mutations were retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletMutationIndexResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page number.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Page size. Values above 100 are capped by the service.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: VALIDATION_ERROR
            message: email must be a well-formed email address
    Conflict:
      description: The request conflicts with an existing resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: EMAIL_ALREADY_REGISTERED
            message: Email is already registered
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: NOT_FOUND
            message: Resource was not found
    Unauthorized:
      description: Authentication is missing or invalid.
    WalletNotFound:
      description: Wallet row was not found for the authenticated user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: WALLET_NOT_FOUND
            message: Wallet was not found for authenticated user

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid request

    AuthRegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: Must contain uppercase, lowercase, digit, and special character.
          example: Password1!

    AuthRegisterShowResponse:
      type: object
      required:
        - user_id
        - email
        - created_at
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time

    AuthLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: Password1!

    AuthRefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    AuthTokenShowResponse:
      type: object
      required:
        - access_token
        - refresh_token
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    AuthMeShowResponse:
      type: object
      required:
        - user_id
        - email
        - role
        - created_at
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          example: USER
        created_at:
          type: string
          format: date-time

    WalletBalanceShowResponse:
      type: object
      required:
        - wallet_id
        - balance
      properties:
        wallet_id:
          type: string
          format: uuid
        balance:
          type: integer
          format: int64
          description: Current balance in whole IDR.
          example: 125000

    WalletMutationIndexResponse:
      type: object
      required:
        - page
        - size
        - total_items
        - total_pages
        - items
      properties:
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        total_items:
          type: integer
          format: int64
          example: 2
        total_pages:
          type: integer
          example: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/WalletMutationIndexElement"

    WalletMutationIndexElement:
      type: object
      required:
        - mutation_id
        - type
        - source
        - amount
        - balance_after
        - created_at
      properties:
        mutation_id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - DEBIT
            - CREDIT
        source:
          type: string
          enum:
            - TRANSFER
            - TOP_UP
        amount:
          type: integer
          format: int64
          description: Mutation amount in whole IDR.
          example: 50000
        balance_after:
          type: integer
          format: int64
          description: Wallet balance after the mutation in whole IDR.
          example: 150000
        related_transaction_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
