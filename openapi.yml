openapi: 3.0.3
info:
  title: GPay Wallet System API
  version: 0.1.0
  description: Implemented API contract for the Auth Service and Wallet Service.

servers:
  - url: http://localhost:8081
    description: Local Auth Service.
  - url: http://localhost:8082
    description: Local Wallet Service.

tags:
  - name: Auth
    description: Operations for user identity, access tokens, and refresh tokens.
  - name: Internal Wallet
    description: Internal service-to-service wallet operations.
  - name: Wallet
    description: Operations for authenticated wallet balance, mutation history, and transfers.

paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a user.
      description: Creates a user account with a BCrypt-hashed password.
      servers:
        - url: http://localhost:8081
          description: Local Auth Service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
      responses:
        "201":
          description: User was registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRegisterShowResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login a user.
      description: Returns a JWT access token and opaque refresh token for valid credentials.
      servers:
        - url: http://localhost:8081
          description: Local Auth Service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenShowResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh tokens.
      description: Rotates a valid refresh token and returns a new access token and refresh token.
      servers:
        - url: http://localhost:8081
          description: Local Auth Service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRefreshRequest"
      responses:
        "200":
          description: Tokens were refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenShowResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags:
        - Auth
      summary: Get the authenticated user.
      description: Returns the profile for the user identified by the JWT access token.
      servers:
        - url: http://localhost:8081
          description: Local Auth Service.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Authenticated user was retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeShowResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /wallets/balance:
    get:
      tags:
        - Wallet
      summary: Get the authenticated wallet balance.
      description: Returns the authenticated user's wallet balance as whole IDR.
      servers:
        - url: http://localhost:8082
          description: Local Wallet Service.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Wallet balance was retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletBalanceShowResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/WalletNotFound"

  /wallets/mutations:
    get:
      tags:
        - Wallet
      summary: List authenticated wallet mutations.
      description: Returns wallet ledger mutations for the authenticated user's wallet only, ordered newest first.
      servers:
        - url: http://localhost:8082
          description: Local Wallet Service.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Wallet mutations were retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletMutationIndexResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /wallets/transfer:
    post:
      tags:
        - Wallet
      summary: Transfer money to another wallet.
      description: Atomically debits the authenticated user's wallet and credits the receiver wallet. Requires durable PostgreSQL idempotency by Idempotency-Key.
      servers:
        - url: http://localhost:8082
          description: Local Wallet Service.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletTransferCreateRequest"
      responses:
        "200":
          description: Transfer response was returned. Duplicate requests with the same idempotency key and payload return the stored response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletTransferShowResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/WalletNotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal/wallets/credit:
    post:
      tags:
        - Internal Wallet
      summary: Credit a wallet from payment-service.
      description: Internal endpoint used by payment-service outbox retry to credit a wallet after a successful top-up. Requires internal token authentication, Idempotency-Key, and idempotency by payment_transaction_id.
      servers:
        - url: http://localhost:8082
          description: Local Wallet Service.
      security:
        - InternalTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalWalletCreditCreateRequest"
      responses:
        "200":
          description: Wallet credit response was returned. Retries for the same payment transaction return the stored response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalWalletCreditShowResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/WalletNotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Durable idempotency key for money-moving requests.
      schema:
        type: string
        minLength: 1
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page number.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Page size. Values above 100 are capped by the service.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validation_error:
              value:
                error: VALIDATION_ERROR
                message: email must be a well-formed email address
            insufficient_balance:
              value:
                error: INSUFFICIENT_BALANCE
                message: Wallet balance is not enough for this transfer
            daily_limit_exceeded:
              value:
                error: DAILY_TRANSFER_LIMIT_EXCEEDED
                message: Daily transfer limit exceeded
            same_wallet_transfer:
              value:
                error: SAME_WALLET_TRANSFER
                message: Sender and receiver wallet must be different
    Conflict:
      description: The request conflicts with an existing resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            email_registered:
              value:
                error: EMAIL_ALREADY_REGISTERED
                message: Email is already registered
            idempotency_key_conflict:
              value:
                error: IDEMPOTENCY_KEY_CONFLICT
                message: Idempotency key was already used with a different request
            payment_transaction_conflict:
              value:
                error: PAYMENT_TRANSACTION_CONFLICT
                message: Payment transaction was already credited with a different request
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: NOT_FOUND
            message: Resource was not found
    Unauthorized:
      description: Authentication is missing or invalid.
    WalletNotFound:
      description: Wallet row was not found for the authenticated user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: WALLET_NOT_FOUND
            message: Wallet was not found for authenticated user

    InsufficientBalance:
      description: Sender wallet balance is not enough for the transfer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: INSUFFICIENT_BALANCE
            message: Wallet balance is not enough for this transfer

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    InternalTokenAuth:
      type: apiKey
      in: header
      name: X-Internal-Token

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid request

    AuthRegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: Must contain uppercase, lowercase, digit, and special character.
          example: Password1!

    AuthRegisterShowResponse:
      type: object
      required:
        - user_id
        - email
        - created_at
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time

    AuthLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: Password1!

    AuthRefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    AuthTokenShowResponse:
      type: object
      required:
        - access_token
        - refresh_token
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    AuthMeShowResponse:
      type: object
      required:
        - user_id
        - email
        - role
        - created_at
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          example: USER
        created_at:
          type: string
          format: date-time

    WalletBalanceShowResponse:
      type: object
      required:
        - wallet_id
        - balance
      properties:
        wallet_id:
          type: string
          format: uuid
        balance:
          type: integer
          format: int64
          description: Current balance in whole IDR.
          example: 125000

    WalletMutationIndexResponse:
      type: object
      required:
        - page
        - size
        - total_items
        - total_pages
        - items
      properties:
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        total_items:
          type: integer
          format: int64
          example: 2
        total_pages:
          type: integer
          example: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/WalletMutationIndexElement"

    WalletMutationIndexElement:
      type: object
      required:
        - mutation_id
        - type
        - source
        - amount
        - balance_after
        - created_at
      properties:
        mutation_id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - DEBIT
            - CREDIT
        source:
          type: string
          enum:
            - TRANSFER
            - TOP_UP
        amount:
          type: integer
          format: int64
          description: Mutation amount in whole IDR.
          example: 50000
        balance_after:
          type: integer
          format: int64
          description: Wallet balance after the mutation in whole IDR.
          example: 150000
        related_transaction_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

    WalletTransferCreateRequest:
      type: object
      required:
        - receiver_wallet_id
        - amount
      properties:
        receiver_wallet_id:
          type: string
          format: uuid
          description: Wallet that receives the transfer credit.
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Transfer amount in whole IDR.
          example: 25000

    WalletTransferShowResponse:
      type: object
      required:
        - transfer_id
        - sender_wallet_id
        - receiver_wallet_id
        - amount
        - status
        - created_at
      properties:
        transfer_id:
          type: string
          format: uuid
        sender_wallet_id:
          type: string
          format: uuid
        receiver_wallet_id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          description: Transfer amount in whole IDR.
          example: 25000
        status:
          type: string
          enum:
            - SUCCESS
        created_at:
          type: string
          format: date-time

    InternalWalletCreditCreateRequest:
      type: object
      required:
        - wallet_id
        - payment_transaction_id
        - amount
      properties:
        wallet_id:
          type: string
          format: uuid
          description: Wallet that receives the top-up credit.
        payment_transaction_id:
          type: string
          format: uuid
          description: Payment-service transaction identifier used for idempotency.
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Credit amount in whole IDR.
          example: 50000

    InternalWalletCreditShowResponse:
      type: object
      required:
        - wallet_id
        - payment_transaction_id
        - amount
        - balance_after
        - credited_at
      properties:
        wallet_id:
          type: string
          format: uuid
        payment_transaction_id:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
          description: Credited amount in whole IDR.
          example: 50000
        balance_after:
          type: integer
          format: int64
          description: Wallet balance after credit in whole IDR.
          example: 150000
        credited_at:
          type: string
          format: date-time
