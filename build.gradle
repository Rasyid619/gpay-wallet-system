// Root aggregator build for the gpay-wallet-system monorepo.
// Each module (`:common` and the four services) configures itself in its own
// build.gradle and keeps independent dependency management.
//
// Spotless is applied here, once, to every Java module so formatting/lint is
// consistent across the repo. The steps intentionally avoid a full reformat
// (no google-java-format) so the existing tab-indented style is preserved.

plugins {
	id 'com.diffplug.spotless' version '6.25.0' apply false
}

subprojects {
	apply plugin: 'com.diffplug.spotless'

	spotless {
		java {
			target 'src/**/*.java'
			removeUnusedImports('cleanthat-javaparser-unnecessaryimport')
			trimTrailingWhitespace()
			endWithNewline()
		}
	}

	// JaCoCo branch-coverage reporting and enforcement is applied uniformly to
	// every Java module. The `java-library` plugin also applies `java`, so the
	// `java` hook covers all modules. Each module's branch threshold is
	// calibrated in its own build.gradle so the gate is meaningful without
	// failing on current code.
	apply plugin: 'jacoco'

	afterEvaluate {
		tasks.named('jacocoTestReport') {
			dependsOn tasks.named('test')
			reports {
				xml.required = true
				html.required = true
			}
		}

		tasks.named('jacocoTestCoverageVerification') {
			dependsOn tasks.named('test')
		}

		tasks.named('test') {
			finalizedBy tasks.named('jacocoTestReport')
		}

		tasks.named('check') {
			dependsOn tasks.named('jacocoTestCoverageVerification')
		}
	}
}
