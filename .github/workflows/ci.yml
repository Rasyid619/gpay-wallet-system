name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Lint, build, and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gpay
          POSTGRES_PASSWORD: gpay
          POSTGRES_DB: gpay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gpay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Create per-service databases
        env:
          PGPASSWORD: gpay
        run: |
          for db in auth_db wallet_db payment_db; do
            psql -h localhost -U gpay -d gpay -c "CREATE DATABASE $db"
          done

      - name: Lint, build, and test
        run: ./gradlew spotlessCheck build --no-daemon --stacktrace
